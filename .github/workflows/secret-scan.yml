name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if any credential is committed
        run: |
          set -euo pipefail
          PATTERNS='ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{22,}|gho_[A-Za-z0-9]{36}|ghu_[A-Za-z0-9]{36}|ghs_[A-Za-z0-9]{36}|ghr_[A-Za-z0-9]{36}|sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----|AIza[0-9A-Za-z_-]{35}|xox[baprs]-[A-Za-z0-9-]{10,}'
          FOUND=0
          # scan tracked files
          if git grep -nEI "$PATTERNS" -- . ':!*.lock' 2>/dev/null; then
            echo "::error::a credential pattern was found in a tracked file — revoke it and purge from history."
            FOUND=1
          fi
          # scan commit messages too
          if git log --all --format='%B' | grep -nEI "$PATTERNS"; then
            echo "::error::a credential pattern was found in a commit message."
            FOUND=1
          fi
          if [ "$FOUND" -ne 0 ]; then exit 1; fi
          echo "No credentials found in tracked files or commit messages. Good."