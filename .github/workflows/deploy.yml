name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege — this workflow only needs to build and publish pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deployments race; cancel superseded runs.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Validate site integrity
        run: |
          set -euo pipefail
          for f in index.html styles.css script.js; do
            if [ ! -s "$f" ]; then echo "::error::missing or empty: $f"; exit 1; fi
            echo "ok  $f ($(wc -c < "$f") bytes)"
          done
          node --check script.js && echo "ok  script.js syntax valid"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4